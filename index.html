<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תרגול לוח הכפל - סנכרון ענן</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary-color: #4A90E2;
      --secondary-color: #50E3C2;
      --accent-color: #9B59B6;
      --bg-color: #F4F7F6;
      --card-bg: #FFFFFF;
      --text-color: #333333;
      --correct-color: #2ECC71;
      --wrong-color: #E74C3C;
      --shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background: var(--card-bg); border-radius: 20px; padding: 30px; width: 100%; max-width: 550px; box-shadow: var(--shadow); text-align: center; position: relative; }
    h1, h2, h3 { margin-bottom: 15px; color: var(--primary-color); }
    .screen { display: none; }
    .screen.active { display: block; }

    .form-group { margin-bottom: 20px; text-align: right; }
    label { display: block; margin-bottom: 8px; font-weight: bold; }
    select { width: 100%; padding: 12px; border: 2px solid #E0E0E0; border-radius: 10px; font-size: 16px; outline: none; background: white; }

    .high-scores-card { background: #F0F7FF; border: 1px solid #BEE3F8; border-radius: 12px; padding: 15px; margin-bottom: 20px; text-align: right; }
    .score-details { font-size: 14px; color: #4A5568; line-height: 1.6; }

    .btn-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
    button { flex: 1; min-width: 120px; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
    button:active { transform: scale(0.98); }
    .btn-primary { background-color: var(--primary-color); color: white; }
    .btn-timed { background-color: var(--accent-color); color: white; }
    .btn-secondary { background-color: #6C757D; color: white; }
    .btn-info { background-color: #17A2B8; color: white; }
    .btn-danger { background-color: var(--wrong-color); color: white; }

    .progress-container { width: 100%; background-color: #E0E0E0; border-radius: 10px; height: 14px; margin-bottom: 15px; overflow: hidden; }
    .progress-fill { height: 100%; background-color: var(--accent-color); width: 0%; transition: width 0.3s ease; }

    .exercise-box { font-size: 48px; font-weight: bold; margin: 25px 0; color: #2C3E50; direction: ltr; }
    .input-answer { font-size: 24px; text-align: center; width: 60%; padding: 10px; border: 2px solid #CBD5E0; border-radius: 10px; margin: 0 auto 15px auto; display: block; }

    .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 12px; margin-top: 20px; direction: ltr; }
    .btn-option { background-color: #EBF5FB; color: var(--primary-color); font-size: 22px; padding: 15px; border: 2px solid #AED6F1; border-radius: 12px; }
    .btn-option.correct { background-color: var(--correct-color) !important; color: white !important; transform: scale(1.1); }
    .btn-option.wrong { background-color: var(--wrong-color) !important; color: white !important; opacity: 0.6; }

    .feedback { height: 28px; font-size: 18px; font-weight: bold; margin-top: 10px; }
    .feedback.reveal { color: #E67E22; }

    /* Dad Dashboard Styles */
    .dashboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; text-align: center; }
    .dashboard-table th, .dashboard-table td { border: 1px solid #E2E8F0; padding: 8px 4px; }
    .dashboard-table th { background-color: #EDF2F7; color: #2D3748; }
    .dad-section { margin-bottom: 25px; text-align: right; }
    .dad-section h4 { color: var(--accent-color); margin-bottom: 8px; font-size: 16px; border-bottom: 2px solid #E2E8F0; padding-bottom: 4px; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- מסך הגדרות -->
    <div id="setup-screen" class="screen active">
      <h1>תרגול לוח הכפל ✖️</h1>
      
      <div class="form-group">
        <label for="user-select">מי מתרגל/ת?</label>
        <select id="user-select" onchange="handleUserChange()">
          <option value="אביב">אביב</option>
          <option value="שקד">שקד</option>
          <option value="אבא">אבא (דאשבורד הורים)</option>
          <option value="אורח">אורח</option>
        </select>
      </div>

      <!-- כרטיס שיאים אישיים (מציג נתונים מהענן) -->
      <div class="high-scores-card" id="student-score-card">
        <h3>🏆 שיא אישי: <span id="record-user-name"></span></h3>
        <div class="score-details" id="record-details">טוען נתונים מהענן...</div>
      </div>

      <!-- כפתורי התחלה לילדים -->
      <div id="student-controls">
        <div class="form-group">
          <label for="size-select">גודל לוח הכפל (5 עד 10):</label>
          <select id="size-select">
            <option value="5">5x5</option>
            <option value="6">6x6</option>
            <option value="7">7x7</option>
            <option value="8">8x8</option>
            <option value="9">9x9</option>
            <option value="10" selected>10x10</option>
          </select>
        </div>

        <div class="btn-group">
          <button class="btn-primary" onclick="startGame('practice')">תרגול פשוט</button>
          <button class="btn-timed" onclick="startGame('timed')">מבחן זמן ⏱️</button>
        </div>
        <div class="btn-group">
          <button class="btn-info" onclick="openTableModal()">הצג לוח כפל 📐</button>
        </div>
      </div>

      <!-- פאנל אבא (דאשבורד הורים) -->
      <div id="dad-controls" style="display: none;">
        <button class="btn-timed" style="width: 100%; margin-bottom: 15px;" onclick="loadDadDashboard()">רענן נתוני ילדים 🔄</button>
        <div id="dad-dashboard-content">טוען נתונים...</div>
      </div>
    </div>

    <!-- מסך תרגול / מבחן -->
    <div id="game-screen" class="screen">
      <div id="timed-progress-wrap">
        <div class="progress-container"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <div class="exercise-box" id="exercise-text">4 × 5 = ?</div>

      <div id="practice-controls">
        <input type="number" id="practice-input" class="input-answer" placeholder="תשובה..." onkeydown="checkPracticeEnter(event)">
        <div class="feedback" id="practice-feedback"></div>
        <div class="btn-group">
          <button class="btn-secondary" onclick="revealAnswer()">גלה לי</button>
          <button class="btn-primary" onclick="checkPracticeAnswer()">בדיקה</button>
        </div>
        <div class="btn-group" style="margin-top: 15px;">
          <button class="btn-danger" onclick="resetToSetup()">סיים תרגול 🏠</button>
        </div>
      </div>

      <div id="timed-controls">
        <div class="options-grid" id="options-container"></div>
        <div class="feedback" id="timed-feedback"></div>
        <div class="btn-group" style="margin-top: 25px;">
          <button class="btn-danger" onclick="resetToSetup()">עזוב מבחן 🛑</button>
        </div>
      </div>
    </div>

    <!-- מסך סיכום -->
    <div id="summary-screen" class="screen">
      <h2>סיכום מבחן - <span id="summary-name"></span> 🎉</h2>
      <div class="grade-badge" id="grade-display" style="font-size:36px; font-weight:bold; color:var(--primary-color); margin:15px 0;">ציון: 100</div>
      <div class="summary-stats" style="background:#F8F9F9; padding:15px; border-radius:12px; text-align:right;">
        <p><strong>סה"כ שאלות:</strong> <span id="stat-total"></span></p>
        <p><strong>תשובות נכונות:</strong> <span id="stat-correct"></span> (<span id="stat-accuracy"></span>%)</p>
        <p><strong>ממוצע לתרגיל:</strong> <span id="stat-avg-time"></span> שניות</p>
      </div>
      <div class="btn-group" style="margin-top: 20px;">
        <button class="btn-primary" onclick="resetToSetup()">תפריט ראשי 🏠</button>
      </div>
    </div>

  </div>

  <script>
    // 1. הגדרת Firebase - יש להחליף בפרטים של הפרויקט שלך ב-Firebase
    // 1. הגדרת Firebase המעודכנת שלך
    const firebaseConfig = {
      apiKey: "AIzaSyBkVA-8VeBzN0pr-PPfjZVeFaLiH1SQa4I",
      authDomain: "multipliers-9e619.firebaseapp.com",
      databaseURL: "https://multipliers-9e619-default-rtdb.firebaseio.com/, // כתובת מסד הנתונים שנוצר
      projectId: "multipliers-9e619",
      storageBucket: "multipliers-9e619.firebasestorage.app",
      messagingSenderId: "53408782394",
      appId: "1:53408782394:web:9a31a4fd3b8784df257d03"
    };

    // אתחול Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // משתני משחק
    let currentUser = 'אביב';
    let boardSize = 10;
    let gameMode = 'practice';
    let exercises = [], currentIdx = 0, correctCount = 0, startTime = 0, mistakes = [], isProcessingTimed = false;

    window.onload = function() {
      handleUserChange();
    };

    function handleUserChange() {
      currentUser = document.getElementById('user-select').value;
      const studentCard = document.getElementById('student-score-card');
      const studentControls = document.getElementById('student-controls');
      const dadControls = document.getElementById('dad-controls');

      if (currentUser === 'אבא') {
        studentCard.style.display = 'none';
        studentControls.style.display = 'none';
        dadControls.style.display = 'block';
        loadDadDashboard();
      } else {
        studentCard.style.display = 'block';
        studentControls.style.display = 'block';
        dadControls.style.display = 'none';
        loadStudentHighScore(currentUser);
      }
    }

    // טעינת שיא אישי מהענן
    function loadStudentHighScore(user) {
      document.getElementById('record-user-name').innerText = user;
      const details = document.getElementById('record-details');
      details.innerText = 'טוען שיא...';

      db.ref(`high_scores/${user}`).once('value').then(snapshot => {
        const record = snapshot.val();
        if (record) {
          details.innerHTML = `<strong>גודל לוח:</strong> ${record.size} | <strong>דיוק:</strong> ${record.accuracy}% | <strong>זמן ממוצע:</strong> ${record.avgTime} ש'`;
        } else {
          details.innerText = 'אין עדיין שיא רשום (נדרש דיוק של 85% ומעלה).';
        }
      });
    }

    // טעינת דאשבורד אבא (שיאים + 10 מבחנים אחרונים)
    function loadDadDashboard() {
      const container = document.getElementById('dad-dashboard-content');
      container.innerHTML = 'מרענן נתונים מהענן...';

      const kids = ['אביב', 'שקד'];
      let html = '';

      const promises = kids.map(kid => {
        return Promise.all([
          db.ref(`high_scores/${kid}`).once('value'),
          db.ref(`history/${kid}`).orderByKey().limitToLast(10).once('value')
        ]).then(([scoreSnap, historySnap]) => {
          const score = scoreSnap.val();
          const historyVal = historySnap.val();

          html += `<div class="dad-section">
            <h4>👦 הנתונים של ${kid}</h4>`;
          
          // הצגת שיא
          if (score) {
            html += `<p style="font-size:13px; margin-bottom:8px;">🏆 <strong>שיא:</strong> לוח ${score.size}, דיוק ${score.accuracy}%, זמן ממוצע ${score.avgTime} ש'</p>`;
          } else {
            html += `<p style="font-size:13px; margin-bottom:8px; color:#718096;">טרם הושג שיא</p>`;
          }

          // הצגת 10 מבחנים אחרונים
          if (historyVal) {
            const historyList = Object.values(historyVal).reverse(); // הכי חדש ראשון
            html += `<table class="dashboard-table">
              <thead>
                <tr>
                  <th>תאריך</th>
                  <th>לוח</th>
                  <th>ציון</th>
                  <th>ממוצע</th>
                </tr>
              </thead>
              <tbody>`;
            
            historyList.forEach(item => {
              html += `<tr>
                <td>${item.date}</td>
                <td>${item.size}</td>
                <td style="font-weight:bold; color:${item.accuracy >= 80 ? 'green' : 'red'}">${item.accuracy}</td>
                <td>${item.avgTime} ש'</td>
              </tr>`;
            });

            html += `</tbody></table>`;
          } else {
            html += `<p style="font-size:12px; color:#A0AEC0;">אין היסטוריית מבחנים</p>`;
          }

          html += `</div>`;
        });
      });

      Promise.all(promises).then(() => {
        container.innerHTML = html;
      });
    }

    /* --- לוגיקת משחק --- */
    function generateExercises(max) {
      const list = [];
      for (let i = 1; i <= max; i++) {
        for (let j = i; j <= max; j++) list.push({ num1: i, num2: j, answer: i * j });
      }
      return list.sort(() => Math.random() - 0.5);
    }

    function startGame(mode) {
      boardSize = parseInt(document.getElementById('size-select').value);
      gameMode = mode;
      const fullList = generateExercises(boardSize);

      exercises = (gameMode === 'timed') ? fullList.slice(0, Math.max(1, Math.round(fullList.length / 3))) : fullList;
      currentIdx = 0; correctCount = 0; mistakes = [];

      document.getElementById('setup-screen').classList.remove('active');
      document.getElementById('game-screen').classList.add('active');

      document.getElementById('practice-controls').style.display = gameMode === 'practice' ? 'block' : 'none';
      document.getElementById('timed-controls').style.display = gameMode === 'timed' ? 'block' : 'none';
      document.getElementById('timed-progress-wrap').style.display = gameMode === 'timed' ? 'block' : 'none';

      startTime = Date.now();
      showNextExercise();
    }

    function showNextExercise() {
      if (gameMode === 'timed' && currentIdx >= exercises.length) { endGame(); return; }
      if (gameMode === 'practice' && currentIdx >= exercises.length) { exercises = generateExercises(boardSize); currentIdx = 0; }

      const ex = exercises[currentIdx];
      document.getElementById('exercise-text').innerText = `${ex.num1} × ${ex.num2} = ?`;

      if (gameMode === 'practice') {
        document.getElementById('practice-input').value = '';
        document.getElementById('practice-input').focus();
        document.getElementById('practice-feedback').innerText = '';
      } else {
        isProcessingTimed = false;
        document.getElementById('progress-fill').style.width = `${(currentIdx / exercises.length) * 100}%`;
        generateOptions(ex.answer);
      }
    }

    function checkPracticeEnter(e) { if (e.key === 'Enter') checkPracticeAnswer(); }
    function checkPracticeAnswer() {
      const val = parseInt(document.getElementById('practice-input').value);
      if (val === exercises[currentIdx].answer) { currentIdx++; showNextExercise(); }
      else { document.getElementById('practice-feedback').innerText = 'תשובה שגויה!'; }
    }
    function revealAnswer() { document.getElementById('practice-feedback').innerText = `הפתרון: ${exercises[currentIdx].answer}`; }

    function generateOptions(correctAnswer) {
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';
      const options = new Set([correctAnswer]);
      while (options.size < 5) {
        let fake = correctAnswer + ((Math.floor(Math.random() * 5) + 1) * (Math.random() < 0.5 ? 1 : -1));
        if (fake > 0 && fake !== correctAnswer) options.add(fake);
      }
      Array.from(options).sort(() => Math.random() - 0.5).forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt;
        btn.onclick = () => handleTimedAnswer(opt, correctAnswer, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function handleTimedAnswer(selected, correct, clickedBtn) {
      if (isProcessingTimed) return;
      isProcessingTimed = true;
      if (selected === correct) { correctCount++; clickedBtn.classList.add('correct'); }
      else { clickedBtn.classList.add('wrong'); }
      setTimeout(() => { currentIdx++; showNextExercise(); }, 600);
    }

    /* --- סיום שמירה בענן --- */
    function endGame() {
      const totalTime = (Date.now() - startTime) / 1000;
      const avgTime = parseFloat((totalTime / exercises.length).toFixed(1));
      const accuracy = Math.round((correctCount / exercises.length) * 100);

      document.getElementById('game-screen').classList.remove('active');
      document.getElementById('summary-screen').classList.add('active');

      document.getElementById('summary-name').innerText = currentUser;
      document.getElementById('grade-display').innerText = `ציון: ${accuracy}`;
      document.getElementById('stat-total').innerText = exercises.length;
      document.getElementById('stat-correct').innerText = correctCount;
      document.getElementById('stat-accuracy').innerText = accuracy;
      document.getElementById('stat-avg-time').innerText = avgTime;

      // שמירה בענן אם המשתמש הוא לא אורח
      if (currentUser !== 'אורח' && currentUser !== 'אבא') {
        saveResultToCloud(currentUser, boardSize, accuracy, avgTime);
      }
    }

    function saveResultToCloud(user, size, accuracy, avgTime) {
      const now = new Date();
      const dateStr = `${now.getDate()}/${now.getMonth()+1} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

      const resultData = {
        date: dateStr,
        size: `${size}x${size}`,
        accuracy: accuracy,
        avgTime: avgTime,
        timestamp: Date.now()
      };

      // 1. שמירה בהיסטוריית המבחנים
      db.ref(`history/${user}`).push(resultData);

      // 2. עדכון שיא אם נדרש (דיוק >= 85%)
      if (accuracy >= 85) {
        db.ref(`high_scores/${user}`).once('value').then(snapshot => {
          const currentRecord = snapshot.val();
          if (!currentRecord || avgTime < currentRecord.avgTime) {
            db.ref(`high_scores/${user}`).set({
              size: `${size}x${size}`,
              accuracy: accuracy,
              avgTime: avgTime
            });
          }
        });
      }
    }

    function resetToSetup() {
      document.getElementById('game-screen').classList.remove('active');
      document.getElementById('summary-screen').classList.remove('active');
      document.getElementById('setup-screen').classList.add('active');
      handleUserChange();
    }
  </script>
</body>
</html>
