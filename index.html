<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תרגול לוח הכפל</title>
  <style>
    :root {
      --primary-color: #4A90E2;
      --secondary-color: #50E3C2;
      --accent-color: #9B59B6;
      --bg-color: #F4F7F6;
      --card-bg: #FFFFFF;
      --text-color: #333333;
      --correct-color: #2ECC71;
      --wrong-color: #E74C3C;
      --shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 520px;
      box-shadow: var(--shadow);
      text-align: center;
      position: relative;
    }

    h1, h2, h3 {
      margin-bottom: 15px;
      color: var(--primary-color);
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* Setup Screen */
    .form-group {
      margin-bottom: 20px;
      text-align: right;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 12px;
      border: 2px solid #E0E0E0;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
      background: white;
    }

    select:focus {
      border-color: var(--primary-color);
    }

    .high-scores-card {
      background: #F0F7FF;
      border: 1px solid #BEE3F8;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: right;
    }

    .high-scores-card h3 {
      font-size: 16px;
      color: #2B6CB0;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .score-details {
      font-size: 14px;
      color: #4A5568;
      line-height: 1.6;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      min-width: 120px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.3s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-timed {
      background-color: var(--accent-color);
      color: white;
    }

    .btn-secondary {
      background-color: #6C757D;
      color: white;
    }

    .btn-info {
      background-color: #17A2B8;
      color: white;
    }

    .btn-danger {
      background-color: var(--wrong-color);
      color: white;
    }

    /* Progress Bar */
    .progress-container {
      width: 100%;
      background-color: #E0E0E0;
      border-radius: 10px;
      height: 14px;
      margin-bottom: 15px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--accent-color);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Game Screen */
    .exercise-box {
      font-size: 48px;
      font-weight: bold;
      margin: 25px 0;
      color: #2C3E50;
      direction: ltr;
    }

    .input-answer {
      font-size: 24px;
      text-align: center;
      width: 60%;
      padding: 10px;
      border: 2px solid #CBD5E0;
      border-radius: 10px;
      margin: 0 auto 15px auto;
      display: block;
      outline: none;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 12px;
      margin-top: 20px;
      direction: ltr;
    }

    .btn-option {
      background-color: #EBF5FB;
      color: var(--primary-color);
      font-size: 22px;
      padding: 15px;
      border: 2px solid #AED6F1;
      border-radius: 12px;
    }

    .btn-option.correct {
      background-color: var(--correct-color) !important;
      color: white !important;
      border-color: var(--correct-color) !important;
      transform: scale(1.1);
      z-index: 2;
    }

    .btn-option.wrong {
      background-color: var(--wrong-color) !important;
      color: white !important;
      border-color: var(--wrong-color) !important;
      opacity: 0.6;
    }

    .feedback {
      height: 28px;
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
    }

    .feedback.reveal {
      color: #E67E22;
    }

    /* Summary Screen */
    .grade-badge {
      font-size: 36px;
      font-weight: bold;
      color: var(--primary-color);
      margin: 15px 0;
    }

    .summary-stats {
      background: #F8F9F9;
      padding: 15px;
      border-radius: 12px;
      margin: 15px 0;
      text-align: right;
    }

    .summary-stats p {
      margin: 8px 0;
      font-size: 17px;
    }

    .errors-list {
      text-align: right;
      margin-top: 15px;
      max-height: 160px;
      overflow-y: auto;
      padding-left: 5px;
    }

    .errors-list h3 {
      font-size: 15px;
      color: #7F8C8D;
      margin-bottom: 8px;
    }

    .error-item {
      background: #FDEDEC;
      border-right: 4px solid var(--wrong-color);
      padding: 8px 12px;
      margin-bottom: 8px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      direction: ltr;
    }

    /* Modal - Multiplication Table */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 10px;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 15px;
      max-width: 95%;
      max-height: 90vh;
      overflow: auto;
      text-align: center;
    }

    .table-grid {
      display: grid;
      gap: 4px;
      margin: 15px 0;
      direction: ltr;
    }

    .table-cell {
      padding: 8px 4px;
      background: #F2F4F4;
      font-size: 13px;
      border-radius: 4px;
      font-weight: 500;
    }

    .table-cell.header {
      background: var(--primary-color);
      color: white;
      font-weight: bold;
    }

    .table-cell.diagonal {
      background: #D4E6F1;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- מסך הגדרות -->
    <div id="setup-screen" class="screen active">
      <h1>תרגול לוח הכפל ✖️</h1>
      
      <div class="form-group">
        <label for="user-select">מי מתרגל/ת?</label>
        <select id="user-select" onchange="updateHighScoresDisplay()">
          <option value="אביב">אביב</option>
          <option value="שקד">שקד</option>
          <option value="אבא">אבא</option>
          <option value="אורח">אורח</option>
        </select>
      </div>

      <!-- כרטיס שיאים אישיים -->
      <div class="high-scores-card">
        <h3>🏆 שיא אישי: <span id="record-user-name"></span></h3>
        <div class="score-details" id="record-details">
          אין עדיין שיא רשום (נדרש דיוק של 85% ומעלה במבחן).
        </div>
      </div>

      <div class="form-group">
        <label for="size-select">גודל לוח הכפל (5 עד 10):</label>
        <select id="size-select">
          <option value="5">5x5</option>
          <option value="6">6x6</option>
          <option value="7">7x7</option>
          <option value="8">8x8</option>
          <option value="9">9x9</option>
          <option value="10" selected>10x10</option>
        </select>
      </div>

      <div class="btn-group">
        <button class="btn-primary" onclick="startGame('practice')">תרגול פשוט</button>
        <button class="btn-timed" onclick="startGame('timed')">מבחן זמן ⏱️</button>
      </div>

      <div class="btn-group">
        <button class="btn-info" onclick="openTableModal()">הצג לוח כפל 📐</button>
      </div>
    </div>

    <!-- מסך תרגול / מבחן -->
    <div id="game-screen" class="screen">
      
      <!-- פרוגרס בר - מופעל רק במבחן זמן -->
      <div id="timed-progress-wrap">
        <div class="progress-container">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>

      <div class="exercise-box" id="exercise-text">4 × 5 = ?</div>

      <!-- ממשק לתרגול פשוט -->
      <div id="practice-controls">
        <input type="number" id="practice-input" class="input-answer" placeholder="תשובה..." onkeydown="checkPracticeEnter(event)">
        <div class="feedback" id="practice-feedback"></div>
        <div class="btn-group">
          <button class="btn-secondary" onclick="revealAnswer()">גלה לי</button>
          <button class="btn-primary" onclick="checkPracticeAnswer()">בדיקה</button>
        </div>
        <div class="btn-group" style="margin-top: 15px;">
          <button class="btn-danger" onclick="resetToSetup()">סיים תרגול 🏠</button>
        </div>
      </div>

      <!-- ממשק למבחן זמן -->
      <div id="timed-controls">
        <div class="options-grid" id="options-container"></div>
        <div class="feedback" id="timed-feedback"></div>
        <div class="btn-group" style="margin-top: 25px;">
          <button class="btn-danger" onclick="resetToSetup()">עזוב מבחן 🛑</button>
        </div>
      </div>
    </div>

    <!-- מסך סיכום מבחן -->
    <div id="summary-screen" class="screen">
      <h2>סיכום מבחן - <span id="summary-name"></span> 🎉</h2>
      
      <div class="grade-badge" id="grade-display">ציון: 100</div>

      <div class="summary-stats">
        <p><strong>סה"כ שאלות במבחן:</strong> <span id="stat-total"></span></p>
        <p><strong>תשובות נכונות:</strong> <span id="stat-correct"></span> (<span id="stat-accuracy"></span>%)</p>
        <p><strong>ממוצע לתרגיל:</strong> <span id="stat-avg-time"></span> שניות</p>
      </div>

      <div class="errors-list" id="errors-container">
        <h3>תרגילים לחיזוק (ממוינים לפי הכופל הגדול):</h3>
        <div id="errors-list-content"></div>
      </div>

      <div class="btn-group" style="margin-top: 20px;">
        <button class="btn-primary" onclick="resetToSetup()">תפריט ראשי 🏠</button>
      </div>
    </div>

  </div>

  <!-- מודאל לוח הכפל -->
  <div class="modal" id="table-modal">
    <div class="modal-content">
      <h2 id="modal-title">לוח הכפל</h2>
      <div id="modal-table-container"></div>
      <button class="btn-secondary" style="margin-top: 15px;" onclick="closeTableModal()">סגור</button>
    </div>
  </div>

  <script>
    // משתני מצב
    let currentUser = '';
    let boardSize = 10;
    let gameMode = 'practice'; // 'practice' | 'timed'
    
    let exercises = [];
    let currentIdx = 0;
    
    let correctCount = 0;
    let startTime = 0;
    let mistakes = [];
    let isProcessingTimed = false;

    // טעינת שיאים בטעינת העמוד
    window.onload = function() {
      updateHighScoresDisplay();
    };

    // בניית מרחב השאלות ללא כפילויות (a <= b)
    function generateExercises(max) {
      const list = [];
      for (let i = 1; i <= max; i++) {
        for (let j = i; j <= max; j++) {
          list.push({ num1: i, num2: j, answer: i * j });
        }
      }
      // ערבוב השאלות
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
      return list;
    }

    function startGame(mode) {
      currentUser = document.getElementById('user-select').value;
      boardSize = parseInt(document.getElementById('size-select').value);
      gameMode = mode;

      const fullList = generateExercises(boardSize);

      if (gameMode === 'timed') {
        // במבחן: שליש מכמות התרגילים האפשריים
        const targetCount = Math.max(1, Math.round(fullList.length / 3));
        exercises = fullList.slice(0, targetCount);
      } else {
        // בתרגול פשוט: רשימה מלאה שתתחדש דינמית בלופ
        exercises = fullList;
      }

      currentIdx = 0;
      correctCount = 0;
      mistakes = [];

      document.getElementById('setup-screen').classList.remove('active');
      document.getElementById('game-screen').classList.add('active');

      if (gameMode === 'practice') {
        document.getElementById('practice-controls').style.display = 'block';
        document.getElementById('timed-controls').style.display = 'none';
        document.getElementById('timed-progress-wrap').style.display = 'none';
      } else {
        document.getElementById('practice-controls').style.display = 'none';
        document.getElementById('timed-controls').style.display = 'block';
        document.getElementById('timed-progress-wrap').style.display = 'block';
        updateProgressBar();
      }

      startTime = Date.now();
      showNextExercise();
    }

    function showNextExercise() {
      if (gameMode === 'timed' && currentIdx >= exercises.length) {
        endGame();
        return;
      }

      // בתרגול פשוט - לופ אינסופי של תרגילים אקראיים
      if (gameMode === 'practice' && currentIdx >= exercises.length) {
        exercises = generateExercises(boardSize);
        currentIdx = 0;
      }

      const ex = exercises[currentIdx];
      document.getElementById('exercise-text').innerText = `${ex.num1} × ${ex.num2} = ?`;

      if (gameMode === 'practice') {
        const input = document.getElementById('practice-input');
        input.value = '';
        input.focus();
        document.getElementById('practice-feedback').innerText = '';
        document.getElementById('practice-feedback').className = 'feedback';
      } else {
        isProcessingTimed = false;
        document.getElementById('timed-feedback').innerText = '';
        updateProgressBar();
        generateOptions(ex.answer);
      }
    }

    function updateProgressBar() {
      const percentage = (currentIdx / exercises.length) * 100;
      document.getElementById('progress-fill').style.width = `${percentage}%`;
    }

    /* --- תרגול פשוט --- */
    function checkPracticeEnter(e) {
      if (e.key === 'Enter') {
        checkPracticeAnswer();
      }
    }

    function checkPracticeAnswer() {
      const input = document.getElementById('practice-input');
      const val = parseInt(input.value);
      const ex = exercises[currentIdx];
      const feedback = document.getElementById('practice-feedback');

      if (isNaN(val)) return;

      if (val === ex.answer) {
        currentIdx++;
        showNextExercise();
      } else {
        feedback.innerText = 'תשובה לא נכונה, נסה שוב!';
        feedback.style.color = 'var(--wrong-color)';
      }
    }

    function revealAnswer() {
      const ex = exercises[currentIdx];
      const feedback = document.getElementById('practice-feedback');
      feedback.innerText = `הפתרון הוא: ${ex.answer}`;
      feedback.className = 'feedback reveal';
    }

    /* --- מבחן זמן --- */
    function generateOptions(correctAnswer) {
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      const options = new Set([correctAnswer]);
      while (options.size < 5) {
        let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() < 0.5 ? 1 : -1);
        let fake = correctAnswer + offset;
        if (fake > 0 && fake !== correctAnswer) {
          options.add(fake);
        }
      }

      const sortedOptions = Array.from(options).sort(() => Math.random() - 0.5);

      sortedOptions.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt;
        btn.onclick = () => handleTimedAnswer(opt, correctAnswer, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function handleTimedAnswer(selected, correct, clickedBtn) {
      if (isProcessingTimed) return;
      isProcessingTimed = true;

      const buttons = document.querySelectorAll('.btn-option');
      const ex = exercises[currentIdx];
      let correctBtn = null;

      buttons.forEach(b => {
        if (parseInt(b.innerText) === correct) correctBtn = b;
      });

      if (selected === correct) {
        correctCount++;
        clickedBtn.classList.add('correct');
      } else {
        clickedBtn.classList.add('wrong');
        if (correctBtn) correctBtn.classList.add('correct');
        
        if (!mistakes.some(m => m.num1 === ex.num1 && m.num2 === ex.num2)) {
          mistakes.push(ex);
        }
      }

      setTimeout(() => {
        currentIdx++;
        showNextExercise();
      }, 700);
    }

    /* --- סיום מבחן ושיאים --- */
    function endGame() {
      const totalTime = (Date.now() - startTime) / 1000;
      const avgTime = parseFloat((totalTime / exercises.length).toFixed(1));
      const accuracy = Math.round((correctCount / exercises.length) * 100);

      document.getElementById('game-screen').classList.remove('active');
      document.getElementById('summary-screen').classList.add('active');

      document.getElementById('summary-name').innerText = currentUser;
      document.getElementById('grade-display').innerText = `ציון: ${accuracy}`;
      document.getElementById('stat-total').innerText = exercises.length;
      document.getElementById('stat-correct').innerText = correctCount;
      document.getElementById('stat-accuracy').innerText = accuracy;
      document.getElementById('stat-avg-time').innerText = avgTime;

      // בדיקה ועדכון שיא אישי (דיוק >= 85%)
      if (accuracy >= 85) {
        saveHighScore(currentUser, boardSize, accuracy, avgTime);
      }

      renderErrorsList();
    }

    function saveHighScore(user, size, accuracy, avgTime) {
      const key = `hs_${user}`;
      const existingRecord = JSON.parse(localStorage.getItem(key));

      // שומרים אם אין שיא קודם, או אם הושג זמן ממוצע מהיר יותר
      if (!existingRecord || avgTime < existingRecord.avgTime) {
        const recordData = {
          size: `${size}x${size}`,
          accuracy: accuracy,
          avgTime: avgTime
        };
        localStorage.setItem(key, JSON.stringify(recordData));
      }
    }

    function updateHighScoresDisplay() {
      const user = document.getElementById('user-select').value;
      document.getElementById('record-user-name').innerText = user;

      const key = `hs_${user}`;
      const record = JSON.parse(localStorage.getItem(key));

      const detailsContainer = document.getElementById('record-details');
      if (record) {
        detailsContainer.innerHTML = `
          <strong>גודל לוח:</strong> ${record.size} | 
          <strong>דיוק:</strong> ${record.accuracy}% | 
          <strong>זמן ממוצע:</strong> ${record.avgTime} שניות
        `;
      } else {
        detailsContainer.innerText = 'אין עדיין שיא רשום (נדרש דיוק של 85% ומעלה במבחן).';
      }
    }

    function renderErrorsList() {
      const container = document.getElementById('errors-list-content');
      container.innerHTML = '';

      if (mistakes.length === 0) {
        container.innerHTML = '<p style="color: var(--correct-color); font-weight: bold;">מושלם! אפס טעויות במבחן! 🏆</p>';
        return;
      }

      // מיון לפי הכופל הגדול ביותר בסדר יורד
      mistakes.sort((a, b) => {
        const maxA = Math.max(a.num1, a.num2);
        const maxB = Math.max(b.num1, b.num2);
        return maxB - maxA;
      });

      mistakes.forEach(ex => {
        const div = document.createElement('div');
        div.className = 'error-item';
        div.innerHTML = `<span>${ex.num1} × ${ex.num2}</span> <strong>= ${ex.answer}</strong>`;
        container.appendChild(div);
      });
    }

    function resetToSetup() {
      document.getElementById('game-screen').classList.remove('active');
      document.getElementById('summary-screen').classList.remove('active');
      document.getElementById('setup-screen').classList.add('active');
      updateHighScoresDisplay();
    }

    /* --- הצגת לוח הכפל --- */
    function openTableModal() {
      const size = parseInt(document.getElementById('size-select').value);
      document.getElementById('modal-title').innerText = `לוח הכפל ${size}x${size}`;
      
      const container = document.getElementById('modal-table-container');
      container.innerHTML = '';

      const grid = document.createElement('div');
      grid.className = 'table-grid';
      grid.style.gridTemplateColumns = `repeat(${size + 1}, 1fr)`;

      // כותרת עליונה ריקה
      const emptyHeader = document.createElement('div');
      emptyHeader.className = 'table-cell header';
      emptyHeader.innerText = '×';
      grid.appendChild(emptyHeader);

      // כותרות עמודות
      for (let c = 1; c <= size; c++) {
        const cell = document.createElement('div');
        cell.className = 'table-cell header';
        cell.innerText = c;
        grid.appendChild(cell);
      }

      // שורות הלוח
      for (let r = 1; r <= size; r++) {
        const rowHeader = document.createElement('div');
        rowHeader.className = 'table-cell header';
        rowHeader.innerText = r;
        grid.appendChild(rowHeader);

        for (let c = 1; c <= size; c++) {
          const cell = document.createElement('div');
          cell.className = 'table-cell';
          if (r === c) cell.classList.add('diagonal');
          cell.innerText = r * c;
          grid.appendChild(cell);
        }
      }

      container.appendChild(grid);
      document.getElementById('table-modal').style.display = 'flex';
    }

    function closeTableModal() {
      document.getElementById('table-modal').style.display = 'none';
    }
  </script>
</body>
</html>
